name: Construir Pago Voz Pro 1.1.1

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: test -f PagoVozPro-1.1.1.zip

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc
          unzip -q PagoVozPro-1.1.1.zip -d buildsrc
          find buildsrc -name settings.gradle.kts -print

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Configurar AndroidX
        run: |
          SETTINGS_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Proyecto: $PROJECT_DIR"
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> "$PROJECT_DIR/gradle.properties"

      - name: Compilar APK
        run: |
          SETTINGS_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Compilando desde: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Buscar APK
        run: |
          APK=$(find buildsrc -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK"
            find buildsrc -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK encontrado: $APK"
          mkdir -p final-apk
          cp "$APK" final-apk/PagoVozPro-1.1.1.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoVozPro-APK-1.1.1
          path: final-apk/PagoVozPro-1.1.1.apk
          if-no-files-found: error
