name: Construir Pago Voz Pro

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Encontrar proyecto Android
        id: find_project
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Proyecto Android encontrado en la raíz"
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Proyecto Android encontrado en: $PROJECT_DIR"
            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar estructura del proyecto
        run: |
          echo "Contenido del repositorio:"
          find . -maxdepth 3 -type f | sort

      - name: Compilar APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Preparar APK
        run: |
          PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"

          mkdir -p final-apk

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "final-apk/PagoVozPro.apk"

          echo "APK preparado correctamente:"
          ls -lh final-apk/PagoVozPro.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoVozPro-APK
          path: final-apk/PagoVozPro.apk
