name: Construir Háblame 1.3.5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame 1.3.5
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar herramientas Android
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Buscar ZIP del proyecto
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "Háblame 1.3.5.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró Háblame 1.3.5.zip."
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descomprimir proyecto
        run: |
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"
          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/buildsrc"

      - name: Verificar estructura
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK generado."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

      - name: Preparar artefacto
        run: |
          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
            "$GITHUB_WORKSPACE/final-apk/Hablame-1.3.5.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-APK-1.3.5
          path: final-apk/Hablame-1.3.5.apk
          if-no-files-found: error
