name: Construir APK Yape Voz Pro 2.4

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          ls -lah
          test -f YapeVoz-Android-2.4-Pro-final.zip

      - name: Descomprimir proyecto 2.4 Pro
        run: |
          mkdir -p buildsrc
          unzip -q YapeVoz-Android-2.4-Pro-final.zip -d buildsrc

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Configurar Java y Kotlin 17
        working-directory: buildsrc
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Compilar APK
        working-directory: buildsrc
        run: |
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: YapeVoz-APK-2.4-Pro
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
