name: Construir APK Yape Voz Pro 2.6.6

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          ls -lah
          test -f YapeVoz-Android-2.6.6-Pro-icono-corregido.zip

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc
          unzip -q YapeVoz-Android-2.6.6-Pro-icono-corregido.zip -d buildsrc
          find buildsrc -name settings.gradle.kts -print

      - name: Corregir referencia del icono
        run: |
          FILE=$(find buildsrc -name YapeWatchdogService.kt -print -quit)
          echo "Archivo encontrado: $FILE"
          sed -i 's/BitmapFactory.decodeResource(resources,/BitmapFactory.decodeResource(getResources(),/' "$FILE"
          grep -n "setLargeIcon" "$FILE"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Configurar Java y Kotlin 17
        run: |
          PROJECT_DIR=$(dirname "$(find buildsrc -name settings.gradle.kts -print -quit)")
          echo "Proyecto encontrado en: $PROJECT_DIR"

          printf '%s\n' \
            '' \
            'android {' \
            '    compileOptions {' \
            '        sourceCompatibility = JavaVersion.VERSION_17' \
            '        targetCompatibility = JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions {' \
            '        jvmTarget = "17"' \
            '    }' \
            '}' >> "$PROJECT_DIR/app/build.gradle.kts"

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(dirname "$(find buildsrc -name settings.gradle.kts -print -quit)")
          echo "Compilando desde: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: YapeVoz-APK-2.6.6
          path: buildsrc/**/app/build/outputs/apk/debug/app-debug.apk
