name: Construir Pago Voz Pro

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Mostrar estructura del repositorio
        run: |
          echo "================================"
          echo "ARCHIVOS DEL REPOSITORIO"
          echo "================================"
          find . -maxdepth 5 -type f | sort

      - name: Buscar proyecto Gradle
        run: |
          echo "================================"
          echo "BUSCANDO ARCHIVOS GRADLE"
          echo "================================"

          find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
          \) -print

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Detener si no existe proyecto Gradle
        run: |
          if ! find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | grep -q .; then

            echo ""
            echo "========================================="
            echo "ERROR: NO SE ENCONTRO EL PROYECTO GRADLE"
            echo "========================================="
            echo ""
            echo "GitHub no encuentra settings.gradle"
            echo "ni settings.gradle.kts en el repositorio."
            echo ""
            exit 1
          fi

      - name: Compilar aplicación
        run: |
          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Contenido:"
          ls -la

          gradle assembleDebug --no-daemon

      - name: Preparar APK
        run: |
          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS")

          mkdir -p final-apk

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             final-apk/PagoVozPro.apk

          ls -lh final-apk/PagoVozPro.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoVozPro-APK
          path: final-apk/PagoVozPro.apk
