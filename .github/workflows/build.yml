name: Construir Háblame 1.4.1

on:
  workflow_dispatch:
  push:
    paths:
      - "Háblame 1.4.1.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Háblame 1.4.1
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar componentes del Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Buscar y extraer el proyecto Háblame 1.4.1
        shell: bash
        run: |
          set -e

          ZIP_FILE="Háblame 1.4.1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No se encontró $ZIP_FILE en la raíz del repositorio."
            echo "Archivos ZIP disponibles:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          mkdir -p proyecto_hablame

          unzip -q "$ZIP_FILE" -d proyecto_hablame

          echo "Contenido extraído:"
          find proyecto_hablame -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) -print

          PROJECT_DIR="$(find proyecto_hablame -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts dentro del ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Comprobar la versión del proyecto
        shell: bash
        run: |
          set -e

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::No se encontró app/build.gradle.kts."
            exit 1
          fi

          echo "Configuración de versión:"
          grep -nE 'versionCode|versionName|applicationId' \
            "$GRADLE_FILE" || true

          if ! grep -q 'versionName.*1\.4\.1' "$GRADLE_FILE"; then
            echo "::error::El proyecto no parece tener versionName 1.4.1."
            exit 1
          fi

      - name: Configurar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK
        shell: bash
        working-directory: .
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Versión de Java:"
          java -version

          echo "Versión de Gradle:"
          gradle --version

          echo "Iniciando compilación de Háblame 1.4.1..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Preparar APK con nombre de versión
        shell: bash
        run: |
          set -e

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::No se encontró el APK esperado."
            echo "Archivos APK generados:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p salida_apk

          cp "$APK_SOURCE" "salida_apk/Hablame-1.4.1.apk"

          echo "APK preparado:"
          ls -lh salida_apk/Hablame-1.4.1.apk

      - name: Guardar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-APK-1.4.1
          path: salida_apk/Hablame-1.4.1.apk
          if-no-files-found: error
          retention-days: 14
