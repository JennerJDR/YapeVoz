name: Construir Pago Voz Pro 1.1.1

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          echo "Archivos del repositorio:"
          ls -lah

          if [ ! -f "PagoVozPro-1.1.1.zip" ]; then
            echo "ERROR: No se encontró PagoVozPro-1.1.1.zip"
            exit 1
          fi

          echo "ZIP encontrado correctamente."

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc

          unzip -q PagoVozPro-1.1.1.zip -d buildsrc

          echo "Contenido del proyecto:"
          find buildsrc -maxdepth 4 -type f | head -100

          echo "Buscando settings.gradle.kts:"
          find buildsrc -name settings.gradle.kts -print

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Preparar proyecto
        shell: bash
        run: |
          SETTINGS_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          echo "Proyecto: $PROJECT_DIR"
          echo "Gradle: $BUILD_FILE"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró app/build.gradle.kts"
            exit 1
          fi

          echo "Creando gradle.properties..."

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            > "$PROJECT_DIR/gradle.properties"

          echo "gradle.properties creado correctamente."

          echo "Configurando Java/Kotlin 17..."

          if ! grep -q 'sourceCompatibility = JavaVersion.VERSION_17' "$BUILD_FILE"; then

            sed -i '/compileSdk = 35/a\
\
    compileOptions {\
        sourceCompatibility = JavaVersion.VERSION_17\
        targetCompatibility = JavaVersion.VERSION_17\
    }\
\
    kotlinOptions {\
        jvmTarget = "17"\
    }' "$BUILD_FILE"

          fi

          echo "Configuración final de Gradle:"
          cat "$BUILD_FILE"

      - name: Compilar APK
        shell: bash
        run: |
          SETTINGS_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Compilando desde:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon

      - name: Buscar APK generado
        shell: bash
        run: |
          echo "Buscando APK generado..."

          APK=$(find buildsrc -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK."

            echo "APK encontrados:"
            find buildsrc -type f -name "*.apk" -print

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p final-apk

          cp "$APK" final-apk/PagoVozPro-1.1.1.apk

          echo "APK final:"
          ls -lh final-apk/

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoVozPro-APK-1.1.1
          path: final-apk/PagoVozPro-1.1.1.apk
          if-no-files-found: error
