name: Construir APK Háblame

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame 1.5.7
    runs-on: ubuntu-latest

    env:
      HABLAME_KEYSTORE_BASE64: ${{ secrets.HABLAME_KEYSTORE_BASE64 }}
      HABLAME_KEYSTORE_PASSWORD: ${{ secrets.HABLAME_KEYSTORE_PASSWORD }}
      HABLAME_KEY_PASSWORD: ${{ secrets.HABLAME_KEY_PASSWORD }}
      HABLAME_KEY_ALIAS: ${{ secrets.HABLAME_KEY_ALIAS }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Buscar ZIP del proyecto
        shell: bash
        run: |
          ZIP_FILE="$GITHUB_WORKSPACE/Háblame 1.5.7.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No se encontró Háblame 1.5.7.zip en la raíz del repositorio."
            echo "Archivos ZIP encontrados:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "ZIP encontrado correctamente."

      - name: Extraer proyecto
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"

          unzip -q "$PROJECT_ZIP" -d "$GITHUB_WORKSPACE/buildsrc"

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No se encontró settings.gradle.kts dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::No se encontró app/build.gradle.kts."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::No se encontró AndroidManifest.xml."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto extraído correctamente."

      - name: Verificar versión e identificador
        shell: bash
        run: |
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          grep -q 'versionName = "1.5.7"' "$GRADLE_FILE" || {
            echo "::error::La versión debe ser 1.5.7."
            exit 1
          }

          grep -q 'versionCode = 61' "$GRADLE_FILE" || {
            echo "::error::El versionCode debe ser 61."
            exit 1
          }

          grep -q 'applicationId = "com.hablame.app"' "$GRADLE_FILE" || {
            echo "::error::El applicationId debe ser com.hablame.app."
            exit 1
          }

          echo "Versión 1.5.7, versionCode 61 e identificador verificados."

      - name: Configurar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK de lanzamiento
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verificar APK generado
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::No se encontró el APK generado."
            echo "Archivos APK disponibles:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name "*.apk" -print || true
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "::error::No se encontró apksigner."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "La verificación de firma del APK terminó correctamente."

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-APK-1.5.7
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
