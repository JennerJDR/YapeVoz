name: Construir APK Yape Voz Pro 2.6.6 Final

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          ls -lah
          test -f YapeVoz-Android-2.6.6-icono-final.zip

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc
          unzip -q YapeVoz-Android-2.6.6-icono-final.zip -d buildsrc
          find buildsrc -name settings.gradle.kts -print

      - name: Corregir referencia de recursos del icono
        run: |
          FILE=$(find buildsrc -name YapeWatchdogService.kt -print -quit)
          echo "Archivo encontrado: $FILE"

          sed -i 's/BitmapFactory.decodeResource(resources,/BitmapFactory.decodeResource(getResources(),/' "$FILE"

          echo "Comprobando referencias del icono:"
          grep -n "BitmapFactory.decodeResource" "$FILE"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: grad
