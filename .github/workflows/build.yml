name: Construir APK Yape Voz

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc
          unzip -q YapeVoz-Android-1.0.zip -d buildsrc

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Corregir proyecto
        working-directory: buildsrc
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Corregir Java/Kotlin
          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s += """
              
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)

          # Corregir TextToSpeech
          p = Path("app/src/main/java/pe/yapevoz/YapeNotificationListener.kt")
          s = p.read_text()

          s = s.replace(
              'val t = TextToSpeech(context) { result ->',
              'lateinit var tts: TextToSpeech\n            tts = TextToSpeech(context) { result ->'
          )
          s = s.replace('t.language = Locale("es", "PE")', 'tts.language = Locale("es", "PE")')
          s = s.replace('t.speak("Prueba de Yape Voz.', 'tts.speak("Prueba de Yape Voz.')

          p.write_text(s)
          PY

      - name: Compilar APK
        working-directory: buildsrc
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: YapeVoz-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
