name: Construir Háblame 1.4.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame 1.4.1
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar componentes Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Buscar ZIP del proyecto
        shell: bash
        run: |
          ZIP_FILE="$GITHUB_WORKSPACE/Háblame 1.4.1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró Háblame 1.4.1.zip en la raíz del repositorio."
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"
          unzip -q "$PROJECT_ZIP" -d "$GITHUB_WORKSPACE/buildsrc"

      - name: Verificar estructura y versión
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -Fq 'versionName = "1.4.1"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

      - name: Preparar APK
        shell: bash
        run: |
          set -e
          mkdir -p final-apk
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
            final-apk/Hablame-1.4.1.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-APK-1.4.1
          path: final-apk/Hablame-1.4.1.apk
          if-no-files-found: error
          retention-days: 7
