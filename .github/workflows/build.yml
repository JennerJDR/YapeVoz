name: Construir Pago Voz PRO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar archivo ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extraer proyecto desde ZIP
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d project

          echo "Contenido del proyecto:"
          find project -maxdepth 3 -type f | sort

      - name: Verificar proyecto Gradle
        shell: bash
        run: |
          if [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: No se encontró project/settings.gradle.kts"
            echo "Contenido de project:"
            find project -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: No se encontró project/app/build.gradle.kts"
            exit 1
          fi

          echo "Proyecto Gradle encontrado correctamente."

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Configurar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK
        working-directory: project
        shell: bash
        run: |
          gradle assembleDebug --no-daemon

      - name: Preparar APK final
        shell: bash
        run: |
          mkdir -p final-apk

          APK=$(find project/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK."
            exit 1
          fi

          echo "APK encontrado: $APK"

          cp "$APK" final-apk/PagoVozPro.apk

          ls -lh final-apk/PagoVozPro.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoVozPro-APK
          path: final-apk/PagoVozPro.apk
          if-no-files-found: error
