name: Construir PagoVoz 1.3.3

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Verificar proyecto
        run: |
          ls -lah
          test -f app/build.gradle.kts
          test -f signing/pagovoz-release.jks
          test -f signing/signing.properties

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Configurar AndroidX
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE"
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> "$PROJECT_DIR/gradle.properties"

      - name: Verificar firma permanente
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE"
          test -f "$PROJECT_DIR/signing/pagovoz-release.jks"
          test -f "$PROJECT_DIR/signing/signing.properties"
          echo "Firma permanente encontrada."

      - name: Compilar APK firmado
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE"
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon

      - name: Verificar firma del APK
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE"
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$GITHUB_WORKSPACE/final-apk"
          cp "$APK" "$GITHUB_WORKSPACE/final-apk/PagoVoz 1.3.3.apk"
          ls -lh "$GITHUB_WORKSPACE/final-apk/PagoVoz 1.3.3.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoVoz-APK-1.3.3
          path: final-apk/PagoVoz 1.3.3.apk
          if-no-files-found: error
