name: Construir Háblame 1.0.0

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Verificar ZIP
        shell: bash
        run: |
          ls -lah

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP de Háblame."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/buildsrc"

          echo "Buscando proyecto..."
          find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Configurar AndroidX
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "android.useAndroidX=true" > \
            "$PROJECT_DIR/gradle.properties"

          echo "android.enableJetifier=true" >> \
            "$PROJECT_DIR/gradle.properties"

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> \
            "$PROJECT_DIR/gradle.properties"

      - name: Verificar estructura del proyecto
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/hablame/app/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/hablame/app/HablameNotificationListener.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/hablame/app/CallStateReceiver.kt"

          echo "Estructura del proyecto correcta."

      - name: Compilar APK
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          cd "$PROJECT_DIR"

          echo "Compilando desde:"
          pwd

          gradle assembleDebug --no-daemon --stacktrace

      - name: Buscar APK generado
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK."

            find "$GITHUB_WORKSPACE/buildsrc" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/final-apk/Hablame-1.0.0-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/final-apk/"

      - name: Verificar firma del APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/final-apk/Hablame-1.0.0-debug.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-APK-1.0.0
          path: final-apk/Hablame-1.0.0-debug.apk
          if-no-files-found: error
