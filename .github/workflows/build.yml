name: Construir PagoVoz 1.3.2

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Verificar ZIP
        shell: bash
        run: |
          set -e
          ls -lah
          test -f "PagoVoz 1.3.2.zip"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e
          mkdir -p buildsrc
          unzip -q "PagoVoz 1.3.2.zip" -d buildsrc

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/signing/pagovoz-release.jks"
          test -f "$PROJECT_DIR/signing/signing.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado correctamente."

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          touch gradle.properties

          grep -q '^android.useAndroidX=' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

          grep -q '^org.gradle.jvmargs=' gradle.properties || \
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> gradle.properties

      - name: Verificar configuración de firma
        shell: bash
        run: |
          set -e
          test -f "$PROJECT_DIR/signing/pagovoz-release.jks"
          test -f "$PROJECT_DIR/signing/signing.properties"
          echo "Se encontraron los archivos de firma."

      - name: Compilar APK de lanzamiento
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon

      - name: Verificar firma y preparar APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK compilado."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          mkdir -p final-apk
          cp "$APK" "final-apk/PagoVoz 1.3.2.apk"

          ls -lh final-apk/

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: PagoVoz-APK-1.3.2
          path: final-apk/PagoVoz 1.3.2.apk
          if-no-files-found: error
