name: Construir Háblame 1.0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame 1.0.1
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Buscar ZIP de Háblame 1.0.1
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "Háblame 1.0.1.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró Háblame 1.0.1.zip en la raíz del repositorio."
            ls -lah
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/buildsrc"
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/buildsrc"

      - name: Verificar proyecto
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts dentro del ZIP."
            find "$GITHUB_WORKSPACE/buildsrc" \
              -maxdepth 4 \
              -type f \
              | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Compilando desde: $PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar firma estable
        shell: bash
        env:
          HABLAME_KEYSTORE_BASE64: ${{ secrets.HABLAME_KEYSTORE_BASE64 }}
          HABLAME_KEYSTORE_PASSWORD: ${{ secrets.HABLAME_KEYSTORE_PASSWORD }}
          HABLAME_KEY_ALIAS: ${{ secrets.HABLAME_KEY_ALIAS }}
          HABLAME_KEY_PASSWORD: ${{ secrets.HABLAME_KEY_PASSWORD }}

        run: |

          if [ -n "$HABLAME_KEYSTORE_BASE64" ] && \
             [ -n "$HABLAME_KEYSTORE_PASSWORD" ] && \
             [ -n "$HABLAME_KEY_ALIAS" ] && \
             [ -n "$HABLAME_KEY_PASSWORD" ]; then

            echo "$HABLAME_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$RUNNER_TEMP/hablame-signing.jks"

            test -s "$RUNNER_TEMP/hablame-signing.jks"

            echo "HABLAME_KEYSTORE_PATH=$RUNNER_TEMP/hablame-signing.jks" \
              >> "$GITHUB_ENV"

            echo "HABLAME_KEYSTORE_PASSWORD=$HABLAME_KEYSTORE_PASSWORD" \
              >> "$GITHUB_ENV"

            echo "HABLAME_KEY_ALIAS=$HABLAME_KEY_ALIAS" \
              >> "$GITHUB_ENV"

            echo "HABLAME_KEY_PASSWORD=$HABLAME_KEY_PASSWORD" \
              >> "$GITHUB_ENV"

            echo "Firma estable de GitHub configurada."

          else

            echo "HABLAME_KEYSTORE_PATH=" >> "$GITHUB_ENV"
            echo "HABLAME_KEYSTORE_PASSWORD=" >> "$GITHUB_ENV"
            echo "HABLAME_KEY_ALIAS=" >> "$GITHUB_ENV"
            echo "HABLAME_KEY_PASSWORD=" >> "$GITHUB_ENV"

            echo "AVISO: No hay secretos de firma."
            echo "Se usará la firma debug de Gradle."

          fi

      - name: Preparar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK 1.0.1
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verificar APK generado
        shell: bash
        run: |

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

      - name: Preparar Artifact
        shell: bash
        run: |

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
            "$GITHUB_WORKSPACE/final-apk/Hablame-1.0.1.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-APK-1.0.1
          path: final-apk/Hablame-1.0.1.apk
          if-no-files-found: error
