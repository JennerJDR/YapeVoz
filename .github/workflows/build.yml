name: Construir Pago Voz 1.2.4

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Verificar ZIP
        run: |
          ls -lah
          test -f PagoVoz-1.2.4.zip

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc
          unzip -q PagoVoz-1.2.4.zip -d buildsrc

          echo "Buscando proyecto..."
          find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Configurar AndroidX
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> "$PROJECT_DIR/gradle.properties"

      - name: Verificar firma permanente
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/signing/pagovoz-release.jks" ]; then
            echo "ERROR: Falta la clave de firma."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/signing/signing.properties" ]; then
            echo "ERROR: Falta signing.properties."
            exit 1
          fi

          echo "Firma permanente encontrada."

      - name: Compilar APK firmado
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          cd "$PROJECT_DIR"

          gradle assembleRelease --no-daemon

      - name: Buscar APK generado
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle.kts -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK."
            find "$GITHUB_WORKSPACE/buildsrc" -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/final-apk/PagoVoz-1.2.4.apk"

          echo "APK generado:"
          ls -lh "$GITHUB_WORKSPACE/final-apk/"

      - name: Verificar firma del APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/final-apk/PagoVoz-1.2.4.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoVoz-APK-1.2.4
          path: final-apk/PagoVoz-1.2.4.apk
          if-no-files-found: error
