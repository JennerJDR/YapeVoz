name: Construir APK Háblame

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame 1.0.0
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Buscar proyecto ZIP
        shell: bash
        run: |
          echo "Archivos encontrados:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP del proyecto."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descomprimir proyecto Háblame
        shell: bash
        run: |
          echo "Descomprimiendo: $PROJECT_ZIP"

          unzip -o "$PROJECT_ZIP" -d .

          echo "Contenido después de descomprimir:"
          ls -lah

      - name: Verificar estructura del proyecto
        shell: bash
        run: |
          echo "Verificando archivos principales..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Estructura del proyecto correcta."

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK generado
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
