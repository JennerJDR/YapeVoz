name: Construir APK Háblame

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame 1.5.4
    runs-on: ubuntu-latest
    env:
      HABLAME_KEYSTORE_BASE64: ${{ secrets.HABLAME_KEYSTORE_BASE64 }}
      HABLAME_KEYSTORE_PASSWORD: ${{ secrets.HABLAME_KEYSTORE_PASSWORD }}
      HABLAME_KEY_PASSWORD: ${{ secrets.HABLAME_KEY_PASSWORD }}
      HABLAME_KEY_ALIAS: ${{ secrets.HABLAME_KEY_ALIAS }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar componentes Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Buscar ZIP del proyecto
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "Háblame 1.5.4.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Sube Háblame 1.5.4.zip a la raíz del repositorio."
            ls -lah
            exit 1
          fi
          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"
          unzip -q "$PROJECT_ZIP" -d "$GITHUB_WORKSPACE/buildsrc"

      - name: Verificar proyecto y versión
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'versionName = "1.5.4"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 58' "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verificar APK generado
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-APK-1.5.4
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
