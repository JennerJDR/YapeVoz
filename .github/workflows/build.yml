name: Construir Yape Voz Pro 2.8.1

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          ls -lah
          test -f YapeVoz-Pro-2.8.1.zip

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc
          unzip -q YapeVoz-Pro-2.8.1.zip -d buildsrc
          find buildsrc -name settings.gradle.kts -print

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Configurar Java y Kotlin 17
        run: |
          SETTINGS_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Proyecto encontrado en: $PROJECT_DIR"

          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF2'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF2

      - name: Compilar APK
        run: |
          SETTINGS_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "
