name: Build Háblame 1.2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Preparar proyecto
        run: |
          set -e
          ZIP_FILE="Háblame 1.2.0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró $ZIP_FILE en la raíz del repositorio."
            exit 1
          fi

          mkdir -p buildsrc
          unzip -q "$ZIP_FILE" -d buildsrc

          SETTINGS_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK Release
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/release/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK compilado."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: No se encontró apksigner."
            exit 1
          fi

          "$APKSIGNER" verify "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Hablame-1.2.0.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-APK-1.2.0
          path: apk-output/Hablame-1.2.0.apk
          if-no-files-found: error
