name: Construir APK Háblame

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuración
        run: gradle assembleDebug --no-daemon

      - name: Verificar que se generó el APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: No se encontró el APK."
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-1.4.7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
