name: Construir APK Háblame

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame 1.0.0
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar SDK necesario
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar proyecto
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
