name: Construir APK Háblame

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar Háblame
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localizar el proyecto
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "Háblame/settings.gradle.kts" ] || [ -f "Háblame/settings.gradle" ]; then
            echo "dir=Háblame" >> "$GITHUB_OUTPUT"
          elif [ -f "Hablame/settings.gradle.kts" ] || [ -f "Hablame/settings.gradle" ]; then
            echo "dir=Hablame" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts."
            echo "Contenido de la raíz del repositorio:"
            ls -la
            exit 1
          fi

          echo "Proyecto encontrado en: $(cat "$GITHUB_OUTPUT" | cut -d= -f2-)"

      - name: Compilar APK de depuración
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug --no-daemon

      - name: Verificar que se generó el APK
        shell: bash
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK esperado."
            find "${{ steps.project.outputs.dir }}" -path '*build/outputs/apk*' -type f
            exit 1
          fi

          ls -lh "$APK"

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Hablame-1.4.7-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
