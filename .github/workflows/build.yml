name: Construir Yape Voz Pro 2.8.4

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          echo "Archivos disponibles:"
          ls -lah

          if [ ! -f "YapeVoz-Pro-2.8.4-Firma-Permanente.zip" ]; then
            echo "ERROR: No se encontró YapeVoz-Pro-2.8.4-Firma-Permanente.zip"
            exit 1
          fi

          echo "ZIP encontrado correctamente."

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc

          unzip -q "YapeVoz-Pro-2.8.4-Firma-Permanente.zip" -d buildsrc

          echo "Buscando proyecto Android..."
          find buildsrc -name "settings.gradle.kts" -print

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Preparar Java y Kotlin 17
        shell: bash
        run: |
          SETTINGS_FILE=$(find buildsrc -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "Archivo Gradle de aplicación:"
          echo "$BUILD_FILE"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró app/build.gradle.kts"
            exit 1
          fi

          python3 - "$BUILD_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              marker = "compileSdk = 35"

              addition = """

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
              """

              if marker not in text:
                  raise SystemExit(
                      "ERROR: No se encontró 'compileSdk = 35' en app/build.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  marker + addition,
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Java 17 y Kotlin 17 configurados correctamente.")
          PY

          echo "Contenido final de app/build.gradle.kts:"
          cat "$BUILD_FILE"

      - name: Verificar archivos de firma
        shell: bash
        run: |
          echo "Buscando archivos relacionados con la firma..."

          find buildsrc \
            \( -name "*.jks" -o -name "*.keystore" -o -name "keystore.properties" \) \
            -print

      - name: Compilar APK Release firmado
        shell: bash
        run: |
          SETTINGS_FILE=$(find buildsrc -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Compilando proyecto desde:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleRelease --no-daemon

      - name: Buscar APK Release
        shell: bash
        run: |
          echo "Buscando APK Release generado..."

          APK=$(find buildsrc \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK Release."

            echo "APK encontrados:"
            find buildsrc -type f -name "*.apk" -print

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p final-apk

          cp "$APK" "final-apk/YapeVoz-Pro-2.8.4-Firma-Permanente.apk"

          echo "APK final:"
          ls -lh final-apk/

      - name: Guardar APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: YapeVoz-Pro-2.8.4-Firma-Permanente
          path: final-apk/YapeVoz-Pro-2.8.4-Firma-Permanente.apk
          if-no-files-found: error
