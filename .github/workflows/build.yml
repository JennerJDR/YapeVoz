name: Construir PagoVoz 1.4.2

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Verificar ZIP
        run: test -f "PagoVoz 1.4.2.zip"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e
          mkdir -p buildsrc
          unzip -q "PagoVoz 1.4.2.zip" -d buildsrc
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/buildsrc" -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/signing/pagovoz-release.jks"
          test -f "$PROJECT_DIR/signing/signing.properties"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon

      - name: Verificar firma y preparar APK
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p final-apk
          cp "$APK" "final-apk/PagoVoz 1.4.2.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoVoz-APK-1.4.2
          path: final-apk/PagoVoz 1.4.2.apk
          if-no-files-found: error
