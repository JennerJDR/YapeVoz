name: Construir Pago Voz Pro 1.1.1

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          ls -lah
          test -f PagoVozPro-1.1.1.zip

      - name: Descomprimir proyecto
        run: |
          mkdir -p buildsrc

          unzip -q PagoVozPro-1.1.1.zip -d buildsrc

          echo "Buscando proyecto..."
          find buildsrc -name settings.gradle.kts -print

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Configurar AndroidX y Java/Kotlin 17
        shell: bash
        run: |
          SETTINGS_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          echo "Proyecto: $PROJECT_DIR"
          echo "Gradle: $BUILD_FILE"

          test -f "$BUILD_FILE"

          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          python3 - "$BUILD_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              marker = "compileSdk = 35"

              addition = """

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
              """

              if marker not in text:
                  raise SystemExit("ERROR: No se encontró compileSdk = 35")

              text = text.replace(
                  marker,
                  marker + addition,
                 
