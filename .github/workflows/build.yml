name: Construir Yape Voz Pro 2.7.4

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          ls -lah

          if [ ! -f "YapeVoz-Pro-2.7.4-definitivo.zip" ]; then
            echo "ERROR: No se encontró YapeVoz-Pro-2.7.4-definitivo.zip"
            exit 1
          fi

          echo "ZIP encontrado correctamente."

      - name: Descomprimir proyecto
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q "YapeVoz-Pro-2.7.4-definitivo.zip" -d buildsrc

          echo "Contenido descomprimido:"
          find buildsrc -maxdepth 4 -type f | head -200

      - name: Encontrar proyecto Android
        run: |
          SETTINGS_FILE=$(find buildsrc -name "settings.gradle.kts" -type f -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Preparar Java y Kotlin 17
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Buscar APK generado
        run: |
          APK=$(find buildsrc -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró app-debug.apk"
            find buildsrc -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK encontrado: $APK"

          mkdir -p final-apk
          cp "$APK" "final-apk/YapeVoz-Pro-2.7.4.apk"

          ls -lh final-apk/

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: YapeVoz-APK-2.7.4
          path: final-apk/YapeVoz-Pro-2.7.4.apk
          if-no-files-found: error
