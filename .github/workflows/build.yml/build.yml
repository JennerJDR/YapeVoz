name: Construir APK Yape Voz

on:
  workflow_dispatch:
  push:
    paths:
      - 'YapeVoz-Android-1.0.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q YapeVoz-Android-1.0.zip -d buildsrc

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Compilar APK
        working-directory: buildsrc
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: YapeVoz-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
